<!DOCTYPE html>
<html lang="en" data-md-src="content/home.md">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-md="page_title"></title>
    <meta name="description" data-md-attr="content={description}">
    <link href="css/home.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
    <script src="js/template.js" defer></script>
</head>
<body>

    <nav class="site-nav" aria-label="Main">
        <div class="wrap">
            <a class="brand" href="#home">Theodora</a>
            <div class="nav-links">
                <a href="#projects">Work</a>
                <a href="#skills" class="hide-sm">Strengths</a>
                <a href="#resume">Experience</a>
                <a href="#contact" class="pill">Get in touch</a>
            </div>
        </div>
    </nav>

    <main class="wrap">

        <header id="home" class="hero">
            <h1><span data-md="name"></span> <span class="muted" data-md="tagline"></span></h1>
            <div class="hero-photo">
                <img src="images/profile.jpg" data-md-attr="alt={name}">
            </div>
        </header>

        <section id="projects" class="work" aria-labelledby="work-title">
            <div class="work-head">
                <h2 id="work-title" class="section-title"><span data-md="work_title"></span> <span class="muted" data-md="work_subtitle"></span></h2>
                <div class="filters" role="group" aria-label="Filter projects">
                    <button type="button" data-filter="All" aria-pressed="true">All</button>
                    <button type="button" data-filter="Marketing" aria-pressed="false">Marketing</button>
                    <button type="button" data-filter="Social media" aria-pressed="false">Social media</button>
                    <button type="button" data-filter="Film" aria-pressed="false">Film</button>
                    <button type="button" data-filter="Events" aria-pressed="false">Events</button>
                    <button type="button" data-filter="Editorial" aria-pressed="false">Editorial</button>
                </div>
            </div>

            <div class="grid-4">
                <a class="project" href="project.html?p=geisha" data-md-src="content/projects/geisha.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/geisha-thumbnail.jpg" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
                <a class="project" href="project.html?p=dll" data-md-src="content/projects/dll.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/dll-thumbnail.jpg" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
                <a class="project" href="project.html?p=bip" data-md-src="content/projects/bip.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/bip-thumbnail.jpg" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
                <a class="project" href="project.html?p=snowy-tattoos" data-md-src="content/projects/snowy-tattoos.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/snowy-thumbnail.png" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
                <a class="project" href="project.html?p=home-advantage" data-md-src="content/projects/home-advantage.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/ha-thumbnail.jpg" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
                <a class="project" href="project.html?p=event-production" data-md-src="content/projects/event-production.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/evntprod-thumbnail.jpg" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
                <a class="project" href="project.html?p=vintigue" data-md-src="content/projects/vintigue.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/vintigue-thumbnail.jpg" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
                <a class="project" href="project.html?p=echoes-redemption" data-md-src="content/projects/echoes-redemption.md" data-md-attr="data-cat={category}">
                    <div class="project-img"><img src="images/thumbnails/echoes-thumbnail.jpg" data-md-attr="alt={card_title}" loading="lazy"></div>
                    <div class="project-body">
                        <div class="cat" data-md="category"></div>
                        <div class="card-title" data-md="card_title"></div>
                        <p class="small" data-md="summary"></p>
                        <span class="more">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></span>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <section id="skills" class="strengths" aria-labelledby="strengths-title">
        <div class="wrap wrap-inner">
            <h2 id="strengths-title" class="section-title"><span data-md="strengths_title"></span> <span class="muted" data-md="strengths_subtitle"></span></h2>
            <div class="grid-4" data-md-list="strengths">
                <template>
                    <div class="strength">
                        <div class="card-title" data-md-item="title"></div>
                        <p class="small" data-md-item="body"></p>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <div class="wrap">
        <section class="about">
            <div id="resume" class="panel experience">
                <h2 class="section-title" data-md="experience_title"></h2>
                <div class="jobs" data-md-list="experience">
                    <template>
                        <div class="job">
                            <div class="job-title" data-md-item="title"></div>
                            <p class="small" data-md-item="body"></p>
                        </div>
                    </template>
                </div>
                <a class="pill" href="documents/cv.pdf" target="_blank" rel="noopener" data-md="resume_button"></a>
            </div>

            <div class="side">
                <div class="panel tools">
                    <h2 class="section-title" data-md="tools_title"></h2>
                    <ul class="chips" data-md="tools"></ul>
                </div>
                <div id="contact" class="contact">
                    <h2 data-md="contact_title"></h2>
                    <a class="email" data-md-attr="href=mailto:{email}" data-md="email"></a>
                    <a class="phone" data-md-attr="href=tel:{phone:digits}" data-md="phone"></a>
                </div>
            </div>
        </section>
    </div>

    <footer class="site-footer">
        <div class="wrap">&copy; <span id="current-year">2026</span> Theodora Ionescu</div>
    </footer>

    <script src="js/home.js"></script>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
