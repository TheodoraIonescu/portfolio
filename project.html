<!DOCTYPE html>
<!-- Template for every project page. Open as project.html?p=<name>, where <name> is a file in content/projects/.
     Layout: a side card (role, figures, tabs) next to the cover, then one tab panel at a time.
     Panels and cards whose content is missing from the Markdown are removed. -->
<html lang="en" data-md-src="content/projects/{p}.md" data-md-attr="style=--accent: {accent}" data-page="project">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-md="page_title"></title>
    <meta name="theme-color" content="#060608">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23060608'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d7ff3e'/%3E%3C/svg%3E">
    <!-- Before first paint: page-transition state (see js/site.js). -->
    <script>
        (function (d) {
            d.classList.add('js');
            try {
                var s = sessionStorage, pt = s.getItem('pt');
                if (pt !== null) { d.classList.add('pt-in'); d.dataset.ptLabel = pt; s.removeItem('pt'); }
            } catch (e) {}
        })(document.documentElement);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300..700&family=Instrument+Serif:ital@0;1&family=Unbounded:wght@300..900&display=swap" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <link href="css/project.css" rel="stylesheet">
    <!-- Optional page theme: "style: geisha" in the Markdown file loads css/geisha.css. -->
    <link rel="stylesheet" data-md-if="style" data-md-attr="href=css/{style}.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" defer></script>
    <script src="js/template.js" defer></script>
    <script src="js/site.js" defer></script>
    <script src="js/project.js" defer></script>
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="grain" aria-hidden="true"></div>

    <header class="nav">
        <div class="wrap nav-inner">
            <a class="brand" href="index.html#home" data-magnetic="0.15" data-title="Home"><span class="brand-mark" aria-hidden="true"></span><span>Theodora Ionescu<span class="brand-dot">.</span></span></a>
            <nav class="nav-links" aria-label="Main">
                <span class="nav-pill" aria-hidden="true"></span>
                <a href="index.html#projects" data-label="Work" data-title="Work"><span>01</span>Work</a>
                <a href="index.html#formats" data-label="Formats" data-title="Formats"><span>02</span>Formats</a>
                <a href="index.html#skills" data-label="Strengths" data-title="Strengths"><span>03</span>Strengths</a>
                <a href="index.html#resume" data-label="Experience" data-title="Experience"><span>04</span>Experience</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-btn nav-kbd" type="button" data-palette-open aria-label="Open command menu"><kbd data-mod>⌘</kbd><kbd>K</kbd></button>
                <button class="icon-btn sound" type="button" data-sound aria-pressed="false" aria-label="Interface sound"><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
                <a class="btn btn-sm nav-cta" href="index.html#contact" data-label="Contact" data-title="Contact" data-magnetic="0.2"><span data-roll>Get in touch</span></a>
                <button class="icon-btn burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menu"><i></i><i></i></button>
            </div>
        </div>
    </header>

    <main id="main" class="p-main">
        <div class="wrap">
            <!-- Back link, position in the list, previous/next (filled by js/project.js). -->
            <div class="p-crumbs mono">
                <a class="p-back" href="index.html#projects" data-title="Work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>All work</a>
                <span class="p-index" data-p-index></span>
                <span class="p-steps"></span>
            </div>

            <!-- ============ Side card and cover ============ -->
            <section class="p-top">
                <aside class="card p-aside">
                    <div class="p-role" data-md-if="role">
                        <span class="p-label mono">Role</span>
                        <p data-md="role"></p>
                    </div>
                    <div class="p-role p-role-alt">
                        <span class="p-label mono">In short</span>
                        <p data-md="summary"></p>
                    </div>
                    <!-- Figures from the timeline, contributions and deliverables (js/project.js). -->
                    <dl class="p-stats"></dl>
                    <!-- One tab per panel below (js/project.js). -->
                    <nav class="p-tabs" role="tablist" aria-label="Project sections" aria-orientation="vertical"></nav>
                </aside>

                <figure class="card p-hero">
                    <img class="p-hero-img" data-md-if="thumbnail" data-md-attr="src={thumbnail};alt={card_title}">
                    <div class="p-hero-shade" aria-hidden="true"></div>
                    <div class="p-hero-text">
                        <div class="p-tags"><span class="tag tag-accent" data-md="category"></span><span class="tag" data-md-if="context" data-md="context"></span></div>
                        <h1 class="p-title" data-md="title" data-split="words"></h1>
                    </div>
                    <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span><span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
                    <span class="p-hero-hud mono" aria-hidden="true" data-p-index></span>
                </figure>
            </section>

            <!-- ============ Panels: one visible at a time ============ -->
            <section class="p-panels" aria-label="Project details">

                <div class="p-panel" id="overview" data-tab="Overview">
                    <article class="card p-card p-overview">
                        <h2 class="p-label mono">Overview</h2>
                        <div class="p-prose p-lead" data-md="overview"></div>
                    </article>
                    <article class="card p-card p-facts" data-md-if="timeline|context">
                        <h2 class="p-label mono">Details</h2>
                        <dl class="p-dl">
                            <div data-md-if="timeline"><dt class="mono">Timeline</dt><dd data-md="timeline"></dd></div>
                            <div data-md-if="context"><dt class="mono">Client / context</dt><dd data-md="context"></dd></div>
                            <div data-md-if="role"><dt class="mono">Role</dt><dd data-md="role"></dd></div>
                        </dl>
                    </article>
                    <article class="card p-card p-tools" data-md-if="tools">
                        <h2 class="p-label mono">Tools &amp; skills</h2>
                        <div class="p-chips" data-md="tools"></div>
                    </article>
                </div>

                <div class="p-panel" id="contributions" data-tab="Contributions" data-md-if="my-contributions" hidden>
                    <div class="p-group" data-md-list="my-contributions">
                        <template>
                            <article class="card p-card p-contrib">
                                <span class="p-num mono"></span>
                                <h2 class="p-card-title" data-md-item="title"></h2>
                                <div class="p-prose" data-md-item="body"></div>
                            </article>
                        </template>
                    </div>
                </div>

                <div class="p-panel p-deliver" id="deliverable" data-tab="Deliverable" data-md-if="deliverable_heading" hidden>
                    <article class="card p-card p-deliver-text">
                        <h2 class="p-label mono">Deliverable</h2>
                        <h3 class="p-card-title p-deliver-title" data-md="deliverable_heading"></h3>
                        <p class="p-prose" data-md-if="deliverable" data-md="deliverable"></p>
                        <a class="btn" target="_blank" rel="noopener" data-md-if="button" data-md-attr="href={button_link}" data-magnetic="0.2"><span data-md="button" data-roll></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
                    </article>

                    <div class="card p-media p-video" data-md-if="video">
                        <div class="cinema">
                            <canvas class="cinema-ambient" aria-hidden="true"></canvas>
                            <div class="cinema-frame">
                                <video class="cinema-video" playsinline preload="metadata" data-md-attr="src={video};poster={video_poster}"></video>
                                <button class="cinema-play" type="button" aria-label="Play the film" data-cursor="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg></button>
                                <div class="cinema-hud mono" aria-hidden="true"><span class="rec">Rec</span><span data-timecode>00:00:00</span></div>
                                <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span><span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
                            </div>
                        </div>
                    </div>

                    <!-- A folder of page images ("magazine:"), or else the PDF itself ("pdf_viewer:"). -->
                    <div class="card p-media p-magazine" data-md-if="magazine|pdf_viewer" data-md-script="js/flipbook.js">
                        <div class="flipbook" data-md-attr="data-src={magazine};data-pdf={pdf_viewer}"></div>
                    </div>

                    <div class="card p-media p-phones" data-md-if="tiktok" data-md-script="js/phones.js">
                        <div class="phones" data-md-tiktok="tiktok"><template><div class="phone-slot"></div></template></div>
                    </div>

                    <div class="p-group" data-md-if="gallery" data-md-list="gallery" data-md-script="js/ring.js">
                        <template>
                            <div class="card p-media p-ring">
                                <h3 class="p-label mono" data-md-item="title"></h3>
                                <div class="ring" data-md-item="images" data-md-wrap="ring-item"></div>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="p-panel" id="reflection" data-tab="Reflection" hidden>
                    <article class="card p-card p-learned" data-md-if="what-i-learned">
                        <h2 class="p-label mono">What I learned</h2>
                        <div class="p-prose p-learn" data-md="what-i-learned"></div>
                    </article>
                    <article class="card p-card p-outcome" data-md-if="outcomes-impact">
                        <h2 class="p-label mono">Outcomes &amp; impact</h2>
                        <div class="p-outcome-body" data-md="outcomes-impact"></div>
                    </article>
                </div>
            </section>

            <!-- Next project (js/project.js). -->
            <nav class="p-next" aria-label="Next project"></nav>
        </div>
    </main>

    <footer class="footer">
        <div class="wrap footer-inner mono">
            <span>&copy; <span data-year>2026</span> Theodora Ionescu</span>
            <span class="footer-kbd">Press <kbd data-mod>⌘</kbd> <kbd>K</kbd> to search</span>
            <button class="to-top" type="button" data-top>Back to top <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
    </footer>
</body>
</html>
